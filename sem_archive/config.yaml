name: SEM archive
version: "0.1.0"
slug: sem_archive
description: Keep every SEM-Meter MQTT message, raw, in hourly compressed files in /share/sem
url: https://github.com/chrissweet/ha-apps/tree/main/sem_archive
arch:
  - amd64
  - aarch64
